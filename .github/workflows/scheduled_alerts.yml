name: Scheduled Alerts

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scheduled-alerts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alert job
        env:
          BINANCE_BASE_URL: https://data-api.binance.vision
          LOG_LEVEL: INFO

          SYMBOLS: ${{ vars.SYMBOLS || '' }}
          SYMBOL: ${{ vars.SYMBOL || 'BTCUSDT' }}

          INTERVAL: ${{ vars.INTERVAL || '1h' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '30' }}
          VMA_LENGTH: ${{ vars.VMA_LENGTH || '20' }}
          MOMENTUM_LENGTH: ${{ vars.MOMENTUM_LENGTH || '9' }}
          OFFSET_PCT: ${{ vars.OFFSET_PCT || '1.0' }}
          INITIAL_DIR: ${{ vars.INITIAL_DIR || 'LONG' }}
          STATE_PATH: state/alerts_state.json

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.jobs.run_and_alert


      - name: Commit updated state (if changed)
        run: |
          if git diff --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/alerts_state.json
          git commit -m "chore: update alert state"
          git push
